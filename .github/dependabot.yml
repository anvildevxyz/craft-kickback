version: 2

updates:
  # Keep GitHub Actions (create-release.yml) current — low noise, high signal.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    labels:
      - dependencies
      - github-actions
    commit-message:
      prefix: ci

  # Composer dependencies — guardrailed for a *library*, where wide version
  # ranges are intentional.
  - package-ecosystem: composer
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - composer
    commit-message:
      prefix: chore
      prefix-development: chore
    # One rollup PR for the dev toolchain instead of one PR per package.
    groups:
      dev-dependencies:
        dependency-type: development
    ignore:
      # We support the whole ^5.8 range on purpose; don't narrow the floor.
      - dependency-name: "craftcms/cms"
